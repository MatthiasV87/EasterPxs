<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Spin the Wheel – Proximus</title>

<style>
:root{
  --px-purple:#5C2D91;
  --px-magenta:#FF418C;
  --px-turquoise:#66D2CC;
  --px-blue:#00BCEE;
  --px-red:#EE2E5D;
  --px-white:#ffffff;
  --px-black:#111111;
}

body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,rgba(92,45,145,.15),rgba(255,65,140,.12));
  font-family: Verdana, Arial, sans-serif;
}

.app{
  width:min(1100px,96vw);
  background:#fff;
  border-radius:20px;
  padding:20px;
  box-shadow:0 20px 45px rgba(0,0,0,.2);
}

.wheel-wrap{
  position:relative;
  width:520px;
  margin:auto;
}

canvas{
  width:100%;
  border-radius:50%;
}

/* ✅ PIJL RECHTS – WIJST NAAR BINNEN (naar links) */
.pointer{
  --bx:8px;
  position:absolute;
  right:-18px;
  top:50%;
  transform:translateY(-50%);
  width:0;height:0;
  border-top:16px solid transparent;
  border-bottom:16px solid transparent;
  border-right:34px solid var(--px-red);
}

/* ✅ Bounce animatie */
@keyframes pointerBounce{
  0%   { transform:translateY(-50%) translateX(0); }
  40%  { transform:translateY(-50%) translateX(calc(var(--bx) * -1)); }
  100% { transform:translateY(-50%) translateX(0); }
}
.pointer.bounce{
  animation:pointerBounce .18s ease-out;
}
</style>
</head>

<body>

<div class="app">
  <div class="wheel-wrap">
    <div class="pointer" id="pointer"></div>
    <canvas id="wheel" width="900" height="900"></canvas>
  </div>

  <div style="text-align:center;margin-top:16px">
    <button onclick="spin()">🎡 SPIN</button>
  </div>

  <div id="result"
       style="margin-top:14px;text-align:center;font-weight:bold;color:#5C2D91">
  </div>
</div>

<script>
const names=[
"WIJCKMANS Herbert","PACCHIONI Adriano","VERRYCKT Anneleen","CAPOZZI Benjamin",
"THORPE Cindy","VAN GEEM Jan","MILOSAVLJEVIC Jasmina","VERHEYDE Jasper",
"LALLEMANT Jérôme","DAVREUX Laetitia","VERRYCKT Liesbeth","DE VROE Marijke",
"LEYERS Sabrina","LIBERT Sophie","WATHY‑LEBOUX‑AMORY Sylvie",
"VAN DEN BOSSCHE Tim","VAN CAMP Viona","FIERS Marieke","DEMEYERE Burt",
"DUMOULIN Christophe","POSMAN Jessica","LAURENT Julie","LISI Laura",
"STOQUART Ludovic","LEDIEU Mike","JANS Sander","FOERIER Sigried",
"VERMEIREN Thomas","VAN DEN BOSSCHE Tim","VAN CAMP Viona"
];

const colors=["#5C2D91","#FF418C","#66D2CC","#00BCEE","#EE2E5D"];
const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");
const pointer=document.getElementById("pointer");
const result=document.getElementById("result");
const R=canvas.width/2;

let angle=0;
let spinning=false;

/* ✅ PIJL RECHTS = 0 graden */
const POINTER_ANGLE = 0;

function drawWheel(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const arc=2*Math.PI/names.length;

  names.forEach((n,i)=>{
    const s=angle+i*arc;
    ctx.beginPath();
    ctx.moveTo(R,R);
    ctx.arc(R,R,R,s,s+arc);
    ctx.fillStyle=colors[i%colors.length];
    ctx.fill();

    ctx.save();
    ctx.translate(R,R);
    ctx.rotate(s+arc/2);
    ctx.fillStyle="#fff";
    ctx.font="bold 20px Verdana";
    ctx.textAlign="right";
    ctx.fillText(n,R-20,6);
    ctx.restore();
  });
}

function indexUnderPointer(){
  const arc=2*Math.PI/names.length;
  const rel=((POINTER_ANGLE-angle)%(2*Math.PI)+(2*Math.PI))%(2*Math.PI);
  return Math.floor(rel/arc);
}

function bounce(px){
  pointer.style.setProperty("--bx",px+"px");
  pointer.classList.remove("bounce");
  void pointer.offsetWidth;
  pointer.classList.add("bounce");
}

function spin(){
  if(spinning) return;
  spinning=true;

  const start=angle;
  const extraSpins=6+Math.random()*4;
  const target=start + extraSpins*2*Math.PI + Math.random()*2*Math.PI;
  const t0=performance.now();
  const duration=4200;

  function animate(t){
    const p=Math.min((t-t0)/duration,1);
    const ease=1-Math.pow(1-p,3); // natuurlijke vertraging
    angle=start+(target-start)*ease;
    drawWheel();
    bounce(3);

    if(p<1){
      requestAnimationFrame(animate);
    }else{
      const winnerIndex=indexUnderPointer();
      bounce(8);
      result.innerHTML="🎉 Winnaar: <b>"+names[winnerIndex]+"</b>";
      spinning=false;
    }
  }
  requestAnimationFrame(animate);
}

drawWheel();
</script>

</body>
</html>
